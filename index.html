<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Collection</title>
<style>
:root, html[data-theme="light"]{
  --bg:#ffffff; --surface:#f7f5f1; --muted-surface:#efebe3;
  --text:#1c1a16; --muted:#6f6a5e; --border:#e3ddd2;
  --accent:#b3541e; --on-accent:#ffffff; --focus:#b3541e;
  --shadow:rgba(60,40,20,.10);
}
html[data-theme="dark"]{
  --bg:#151310; --surface:#1f1c17; --muted-surface:#292520;
  --text:#f1ece1; --muted:#aaa195; --border:#38332a;
  --accent:#e08a3c; --on-accent:#1c1105; --focus:#e08a3c;
  --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h1{font-size:26px;margin:0 0 4px}
.sub{font-size:14px;color:var(--muted);margin:0 0 18px}
.themebtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer;flex:none}
.themebtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 2px 10px var(--shadow)}
.ctitle{font-size:19px;font-weight:700;margin:0 0 4px}
.cdesc{font-size:14px;color:var(--muted);margin:0 0 6px}
.cmeta{font-size:13px;color:var(--muted);margin:0 0 14px}
.cmeta a{color:var(--accent)}
.copen{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 18px;font-size:14.5px;font-weight:700;text-decoration:none}
.copen:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin-top:18px}
.empty{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Recipe Collection</h1>
      <p class="sub">Interactive cook-along recipes, extracted step by step from YouTube videos.</p>
    </div>
    <button class="themebtn" id="themeBtn">Theme: Auto</button>
  </div>
  <div class="grid" id="grid"></div>
  <noscript>
    <div class="card">
      <div class="ctitle">Dindigul Chicken Biriyani</div>
      <div class="cdesc">One-pot basmati version · interactive cook-along with timers</div>
      <div class="cmeta">From Chef Deena's Kitchen (CDK 1375) · <a href="https://youtu.be/91hyX0x8K9w">Watch the video</a></div>
      <a class="copen" href="91hyX0x8K9w/">Open recipe</a>
    </div>
  </noscript>
  <p class="note" id="countNote"></p>
</div>
<script>
(function(){
"use strict";
/* To add a recipe: push a folder named after the video ID containing index.html,
   then add one entry here. */
var RECIPES = [
  {id:"91hyX0x8K9w",
   title:"Dindigul Chicken Biriyani",
   desc:"One-pot basmati version · interactive cook-along with timers",
   source:"Chef Deena's Kitchen (CDK 1375)",
   video:"https://youtu.be/91hyX0x8K9w"}
];
var KEY='recipe-catalogue-theme', theme='auto';
try{ theme=localStorage.getItem(KEY)||'auto'; }catch(e){}
function applyTheme(){
  var eff=theme;
  if(theme==='auto'){ eff=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
  document.documentElement.setAttribute('data-theme',eff);
  document.getElementById('themeBtn').textContent='Theme: '+(theme==='auto'?'Auto':(theme==='dark'?'Dark':'Light'));
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var grid=document.getElementById('grid');
if(!RECIPES.length){
  grid.innerHTML='<div class="empty">No recipes yet — check back soon.</div>';
}else{
  grid.innerHTML=RECIPES.map(function(r){
    return '<div class="card"><div class="ctitle">'+esc(r.title)+'</div>'
      +'<div class="cdesc">'+esc(r.desc)+'</div>'
      +'<div class="cmeta">From '+esc(r.source)+' · <a href="'+esc(r.video)+'">Watch the video</a></div>'
      +'<a class="copen" href="'+esc(r.id)+'/">Open recipe</a></div>';
  }).join('');
}
document.getElementById('countNote').textContent =
  RECIPES.length+(RECIPES.length===1?' recipe':' recipes')+' so far — more will appear here as they are added.';
document.getElementById('themeBtn').onclick=function(){
  theme=theme==='auto'?'light':(theme==='light'?'dark':'auto');
  try{localStorage.setItem(KEY,theme);}catch(e){}
  applyTheme();
};
applyTheme();
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener){mq.addEventListener('change',function(){if(theme==='auto')applyTheme();});}}
})();
</script>
</body>
</html>
